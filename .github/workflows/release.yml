name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check version and master ancestry
        id: tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a version tag in the form vX.Y.Z."
            exit 1
          fi
          git fetch origin master
          if ! git merge-base --is-ancestor "${TAG}^{commit}" origin/master; then
            echo "::error::The tagged commit must belong to master."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.rid }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Run all tests before publishing
        run: dotnet test QRLab.sln --configuration Release
      - name: Publish application with .NET runtime
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          RID: ${{ matrix.rid }}
        shell: bash
        run: |
          dotnet publish QRLab.View/QRLab.View.csproj \
            --configuration Release --runtime "$RID" --self-contained true \
            -p:Version="$VERSION" -p:PublishTrimmed=false \
            --output artifacts/publish
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          RID: ${{ matrix.rid }}
        run: Compress-Archive -Path artifacts/publish/* -DestinationPath "artifacts/QRLab-$env:TAG-$env:RID.zip"
      - name: Package Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          RID: ${{ matrix.rid }}
        run: tar -czf "artifacts/QRLab-$TAG-$RID.tar.gz" -C artifacts/publish .
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts
      - name: Create release and upload archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" artifacts/* --verify-tag --title "$TAG" --generate-notes
